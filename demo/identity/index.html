<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#231A2B">
<title>سِمة | مساحة عمل الهويات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Readex+Pro:wght@300;400;500;600&display=swap">
<style>
:root{
  --paper:#ECEEE9; --sheet:#F8F9F5; --ink:#231A2B; --ink-2:#564C5D; --ink-3:#7A7180; --plum:#5E3B5A;
  --brass:#C9A866; --brass-d:#86662B; --line:#D3D6CE; --line-2:#E2E4DE;
  --dk:#231A2B; --dk-2:#2E2537; --dk-line:#463B51; --dk-txt:#EFEAF0; --dk-mute:#A99FAF;
  --ff:"Readex Pro",system-ui,sans-serif; --fd:"Aref Ruqaa","Readex Pro",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ff);font-size:16px;line-height:1.65}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plum);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

/* app bar */
.bar{background:var(--dk);color:var(--dk-txt);padding:calc(10px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 10px max(18px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.logo svg{width:30px;height:30px;flex:none}
.logo b{font-family:var(--fd);font-weight:700;font-size:27px;line-height:1}
.crumb{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dk-mute);min-width:0}
.crumb::before{content:"";width:1px;height:20px;background:var(--dk-line)}
.crumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb strong{color:var(--dk-txt);font-weight:500}
.status{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dk-mute);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:#7C7385}
.status[data-s=busy] i{background:var(--brass);animation:pulse 1s ease-in-out infinite alternate}
.status[data-s=ok] i{background:#8FC6A0}
.status[data-s=err] i{background:#E29A8B}
@keyframes pulse{to{opacity:.3}}
@media (max-width:560px){.crumb .p{display:none}}

/* workspace */
.ws{display:grid;grid-template-columns:1fr;align-items:start}
@media (min-width:1000px){
  .ws{grid-template-columns:372px 1fr;min-height:calc(100vh - 52px)}
  .brief{position:sticky;top:52px;min-height:calc(100vh - 52px)}
}

/* brief panel */
.brief{background:var(--dk-2);color:var(--dk-txt);padding:22px max(18px,env(safe-area-inset-right)) 24px max(18px,env(safe-area-inset-left))}
.brief h2{font-size:15px;font-weight:500;margin:0 0 18px;color:var(--dk-mute)}
.f{margin:0 0 20px;padding:0;border:0;min-width:0}
.f>label,.f>legend{display:block;font-size:13.5px;color:var(--dk-mute);margin:0 0 7px;padding:0}
.f input[type=text]{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--dk-line);border-radius:0;padding:6px 0 8px;color:#fff;font-size:21px;font-weight:500;min-height:46px}
.f input[type=text]:focus-visible{outline:none;border-bottom-color:var(--brass)}
.f input.en{direction:ltr;text-align:right;font-size:18px;font-weight:400;letter-spacing:.02em}
.f input::placeholder{color:#7C7385}
.sectors{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--dk-line);border:1px solid var(--dk-line);border-radius:4px;overflow:hidden}
.tile{position:relative;background:var(--dk-2)}
.tile input,.tog input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.tile span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:70px;font-size:13.5px;color:#D9D2DB;cursor:pointer;transition:background .12s}
.tile svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile:hover span{background:#352B3F}
.tile input:checked+span{background:var(--brass);color:var(--dk)}
.tile input:focus-visible+span,.tog input:focus-visible+span{outline:2px solid var(--brass);outline-offset:-4px}
.tones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tog{position:relative}
.tog span{display:flex;align-items:center;gap:9px;min-height:44px;padding:0 12px;border-bottom:1.5px solid var(--dk-line);font-size:15px;color:#D9D2DB;cursor:pointer}
.tog span::before{content:"";width:14px;height:14px;border:1.5px solid #7C7385;border-radius:2px;flex:none}
.tog input:checked+span{color:#fff;border-bottom-color:var(--brass)}
.tog input:checked+span::before{background:var(--brass);border-color:var(--brass);box-shadow:inset 0 0 0 2.5px var(--dk-2)}
.hint{font-size:13px;color:var(--dk-mute);margin:8px 0 0;min-height:1.3em}
.hint.warn{color:#F0C98A}
.go{width:100%;min-height:54px;border:0;border-radius:4px;background:var(--brass);color:var(--dk);font-weight:600;font-size:17px;cursor:pointer;margin-top:6px}
.go:hover{background:#D6B677}
.go:active{transform:translateY(1px)}
.go[disabled]{opacity:.6;cursor:progress}
.go:focus-visible{outline-color:#fff}

/* board */
.board{min-width:0;padding:0 0 10px;scroll-margin-top:56px}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:24px 22px 0}
.phead h1{font-size:24px;font-weight:500;margin:0;line-height:1.3}
.phead small{font-size:13px;color:var(--ink-3)}
.empty{padding:22px}
.empty p{margin:14px 0 0;color:var(--ink-2);font-size:14.5px}
.skel{display:grid;gap:14px;grid-template-columns:1.4fr 1fr}
.skel div{background:#E1E4DD;border-radius:3px;position:relative;overflow:hidden}
.skel .a{grid-row:span 3;min-height:300px}
.skel .b{height:84px}.skel .c{height:110px}.skel .d{height:96px}
.skel .e{grid-column:1/-1;height:120px}
.busy .skel div::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(100%);animation:sh 1.3s linear infinite}
@keyframes sh{to{transform:translateX(-100%)}}
.state{padding:40px 22px;max-width:34em}
.state p{margin:0 0 14px}
.btn2{min-height:44px;padding:8px 18px;border-radius:4px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-weight:500}
.btn2:hover{background:var(--ink);color:var(--sheet)}

/* result */
.hero{display:grid;gap:0;padding:18px 22px 6px}
@media (min-width:1180px){.hero{grid-template-columns:1.25fr 1fr;gap:30px;align-items:start}}
.stage{display:grid;place-items:center;padding:30px 16px;min-height:280px;border-radius:3px}
.stage svg{width:min(100%,400px);height:auto;display:block}
.vrow{display:flex;gap:8px;margin-top:10px}
.vbtn{flex:1;max-width:84px;aspect-ratio:1;padding:8px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;border-radius:3px}
.vbtn svg{width:100%;height:100%;display:block}
.vbtn:hover{border-color:var(--ink-3)}
.vbtn[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.vrow .lbl{align-self:center;font-size:13px;color:var(--ink-3);margin-inline-start:6px}
.idea{padding-top:18px}
.idea .concept{font-size:clamp(18px,4.4vw,21px);line-height:1.7;margin:0 0 16px}
.sl{margin:0 0 4px;font-size:22px;line-height:1.5}
.sl.en{direction:ltr;text-align:right;font-size:17px;color:var(--ink-2)}
.voice{margin:16px 0 0;font-size:14px;color:var(--ink-2)}
.voice b{font-weight:500;color:var(--ink)}
.dl{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.dl button{min-height:44px;padding:8px 16px;border-radius:4px;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);cursor:pointer;font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.dl button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dl button.ghost{background:transparent;color:var(--ink)}
.dl button:hover{opacity:.88}
.note{font-size:12.5px;color:var(--ink-3);margin:10px 0 0}

.sec{padding:30px 22px 6px}
.sec>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:16px}
.sec h3{font-family:var(--fd);font-weight:700;font-size:23px;line-height:1.2;margin:0}
.sec header small{font-size:13px;color:var(--ink-3)}

.palette{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr .8fr}
.sw{border:0;margin:0;padding:12px 12px 10px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;text-align:start;cursor:pointer;font-size:12.5px;line-height:1.4}
.sw .nm{font-weight:500;font-size:15px}
.sw .hx{direction:ltr;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.03em;margin-top:6px}
.sw .cp{font-size:12px;opacity:0;transition:opacity .15s}
.sw:hover .cp,.sw:focus-visible .cp,.sw.done .cp{opacity:.9}
.sw:focus-visible{outline-offset:-4px}
@media (max-width:640px){
  .palette{grid-template-columns:1fr 1fr}
  .sw{min-height:104px}
  .sw:first-child{grid-column:span 2;min-height:150px}
  .sw:last-child{grid-column:span 2;min-height:72px}
  .sw .cp{opacity:.8}
}
.fixes{margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.fixes li{margin-top:4px}

.type{display:grid;gap:0}
@media (min-width:780px){.type{grid-template-columns:1.3fr 1fr}}
.spec{padding:20px 18px;overflow:hidden;min-width:0}
.spec .big{font-size:clamp(42px,11vw,68px);line-height:1.3;margin:0;overflow-wrap:anywhere}
.spec .line{font-size:17px;margin:8px 0 0;line-height:1.8;overflow-wrap:anywhere}
.spec .meta{font-size:12.5px;margin:14px 0 0;opacity:.8;font-family:var(--ff)}
.spec.lat{direction:ltr;text-align:left}

.mocks{display:grid;gap:26px 22px}
@media (min-width:800px){.mocks{grid-template-columns:1fr 1fr}}
.mocks figure{margin:0;min-width:0}
.mocks svg{display:block;width:100%;height:auto}
.mocks figcaption{font-size:13px;color:var(--ink-3);margin-top:8px}
.cards{display:grid;gap:12px}
.cards svg{border-radius:6px;box-shadow:0 1px 0 rgba(35,26,43,.08),0 14px 26px -18px rgba(35,26,43,.55)}
.post{background:#fff;border:1px solid var(--line-2)}
.post header{display:flex;align-items:center;gap:10px;padding:10px 12px}
.post .av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none}
.post .av svg{width:100%;height:100%}
.post header b{font-weight:500;font-size:14px;display:block;line-height:1.3}
.post header small{font-size:12px;color:var(--ink-3)}
.post .cap{padding:10px 12px 14px;font-size:14px;margin:0}
.wide{grid-column:1/-1}
.again{padding:26px 22px 8px}

.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom));margin-inline:auto;width:max-content;max-width:90vw;background:var(--dk);color:var(--dk-txt);padding:10px 18px;border-radius:4px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}

footer{padding:18px max(22px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line)}
footer .cr{margin-inline-end:auto}
footer a{color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
footer a:hover{color:var(--ink);text-decoration:underline}
footer img{height:16px;width:auto}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<header class="bar">
  <a class="logo" href="./" aria-label="سِمة">
    <svg viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="2" fill="#C9A866"/><path d="M8 26V14a7 7 0 0 1 14 0v12" fill="none" stroke="#231A2B" stroke-width="2.2"/><path d="M12 26v-9.5a3 3 0 0 1 6 0V26" fill="#231A2B"/><circle cx="15" cy="5.6" r="1.6" fill="#231A2B"/></svg>
    <b>سِمة</b>
  </a>
  <div class="crumb"><span class="p">المشاريع</span><strong><span id="crumbName">مشروع جديد</span></strong></div>
  <div class="status" id="status" data-s="idle" aria-live="polite"><i></i><span id="statusTxt">مسودة</span></div>
</header>

<div class="ws">
  <form class="brief" id="brief" novalidate>
    <h2>الملف التعريفي</h2>
    <div class="f">
      <label for="nameAr">اسم النشاط</label>
      <input type="text" id="nameAr" name="nameAr" maxlength="40" value="بُنّ الوادي" autocomplete="organization" required>
    </div>
    <div class="f">
      <label for="nameEn">الاسم بالإنجليزي، اختياري</label>
      <input type="text" id="nameEn" name="nameEn" class="en" maxlength="40" value="Wadi Bunn" dir="ltr" autocomplete="off">
    </div>
    <fieldset class="f">
      <legend>القطاع</legend>
      <div class="sectors" id="sector"></div>
    </fieldset>
    <fieldset class="f" aria-describedby="personaHint">
      <legend>الشخصية، من كلمتين إلى ثلاث</legend>
      <div class="tones" id="persona"></div>
      <p class="hint" id="personaHint" aria-live="polite"></p>
    </fieldset>
    <button class="go" id="go" type="submit">صمم الهوية</button>
  </form>

  <main class="board" id="board" aria-live="polite" aria-busy="false">
    <div class="phead"><h1 id="pTitle">بُنّ الوادي</h1><small>لم تُصمم بعد</small></div>
    <div class="empty" id="empty">
      <div class="skel" aria-hidden="true"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div><div class="e"></div></div>
      <p>اللوحة فاضية. راجع الملف التعريفي واضغط «صمم الهوية».</p>
    </div>
  </main>
</div>

<footer>
  <span class="cr">جميع الحقوق محفوظة لاستوديو سِمة</span>
  <a href="https://yazeedalharthi.sa/#services">تصميم وتطوير <img src="/assets/yh-mark-on-light.svg" alt="" width="24" height="16"> يزيد الحارثي</a>
  <a href="https://yazeedalharthi.sa/#services">تبي نسخة لمنشأتك؟ اطلب عرض سعر</a>
</footer>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const SECTORS = ['مقهى','عطور','عيادة','تقنية','مقاولات','أزياء','مطعم','تعليم'];
const PERSONAS = ['فخم','عصري','دافئ','جريء','هادئ','تراثي'];
const AR_FONTS = ['Amiri','Noto Naskh Arabic','Aref Ruqaa','El Messiri','Reem Kufi','Noto Kufi Arabic','Readex Pro','IBM Plex Sans Arabic','Tajawal','Cairo','Changa','Lalezar','Marhey','Almarai'];
const LAT_FONTS = ['Cormorant Garamond','Playfair Display','DM Serif Display','Fraunces','Josefin Sans','Montserrat','Space Grotesk','Syne','Outfit','Archivo'];
const ONLY400 = new Set(['Lalezar','DM Serif Display']);
const ROLES = ['أساسي','ثانوي','خلفية','نص','لمسة'];
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = (s) => document.querySelector(s);

/* ---------- form ---------- */
const ICONS = {
  'مقهى':'<path d="M5 10h11v4a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M9 3c-.8 1 .8 2 0 3.5M12.5 3c-.8 1 .8 2 0 3.5"/>',
  'عطور':'<rect x="6" y="9" width="12" height="12" rx="2"/><path d="M10 9V6h4v3M9 4h6"/><path d="M9.5 15h5"/>',
  'عيادة':'<path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/><path d="M12 10v5M9.5 12.5h5"/>',
  'تقنية':'<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>',
  'مقاولات':'<path d="M4 21h16M6 21V9l6-5 6 5v12"/><path d="M10 21v-6h4v6"/>',
  'أزياء':'<path d="M12 7a2 2 0 1 0-2-2"/><path d="M12 7v2L3 16h18l-9-7"/>',
  'مطعم':'<path d="M4 13h16a8 8 0 0 1-16 0z"/><path d="M8 4l2 7M14 3l-1 8"/>',
  'تعليم':'<path d="M3 6.5C6 5 9 5 12 7c3-2 6-2 9-.5V19c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5z"/><path d="M12 7v12.5"/>'
};
function chip(group, type, value, checked){
  const l = document.createElement('label'); l.className = type === 'radio' ? 'tile' : 'tog';
  const i = document.createElement('input'); i.type = type; i.name = group; i.value = value; i.checked = checked;
  const s = document.createElement('span');
  if (type === 'radio'){ const ic = document.createElementNS(SVGNS, 'svg'); ic.setAttribute('viewBox','0 0 24 24'); ic.setAttribute('aria-hidden','true'); ic.innerHTML = ICONS[value]; s.append(ic); }
  s.append(document.createTextNode(value));
  l.append(i, s); return l;
}
SECTORS.forEach((s) => $('#sector').append(chip('sector','radio',s,s==='مقهى')));
PERSONAS.forEach((p) => $('#persona').append(chip('persona','checkbox',p,p==='دافئ'||p==='تراثي')));
$('#nameAr').addEventListener('input', () => { if (!SPEC) $('#pTitle').textContent = $('#nameAr').value.trim() || 'مشروع جديد'; });
let pOrder = ['دافئ','تراثي'];
$('#persona').addEventListener('change', (e) => {
  const v = e.target.value;
  if (e.target.checked){
    pOrder.push(v);
    if (pOrder.length > 3){
      const drop = pOrder.shift();
      const el = document.querySelector('#persona input[value="'+drop+'"]'); if (el) el.checked = false;
      hint('ثلاث كلمات بالكثير، شلنا «'+drop+'».');
    } else hint('');
  } else { pOrder = pOrder.filter((x) => x !== v); hint(''); }
});
function hint(t, warn){ const h = $('#personaHint'); h.textContent = t; h.classList.toggle('warn', !!warn); }

/* ---------- color ---------- */
function normHex(h){
  if (typeof h !== 'string') return null;
  let s = h.trim().replace(/^#/, '');
  if (/^[0-9a-f]{3}$/i.test(s)) s = s.split('').map((c) => c + c).join('');
  return /^[0-9a-f]{6}$/i.test(s) ? '#' + s.toUpperCase() : null;
}
function rgb(h){ const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function hex([r,g,b]){ return '#' + [r,g,b].map((v) => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase(); }
function lum(h){ return rgb(h).map((v) => { v/=255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }).reduce((a,v,i) => a + v*[.2126,.7152,.0722][i], 0); }
function contrast(a,b){ const x = lum(a), y = lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); }
function mix(a,b,t){ const A = rgb(a), B = rgb(b); return hex(A.map((v,i) => v + (B[i]-v)*t)); }
function sat(h){ const [r,g,b] = rgb(h).map((v) => v/255); const mx = Math.max(r,g,b), mn = Math.min(r,g,b); return mx === 0 ? 0 : (mx-mn)/mx; }

let FIXES = [];
// pick a text color on bg with contrast >= min; log any fix
function ensure(want, bg, min, label, pal){
  if (contrast(want,bg) >= min) return want;
  const pool = [...(pal || []), '#FFFFFF', '#1A1A1A'];
  // try nudging the wanted color first (keeps the hue), then palette, then white/black
  const dark = lum(bg) > .3;
  for (let t = .15; t <= 1.001; t += .15){
    const c = mix(want, dark ? '#141414' : '#FFFFFF', t);
    if (contrast(c,bg) >= min){ logFix(label, want, c, contrast(want,bg)); return c; }

// lockups: return {g, w, h}
function lockup(spec, c, v, layout){
  const g = el('g');
  const showIcon = spec.type !== 'wordmark';
  const ar = spec.nameAr, en = spec.nameEn ? spec.nameEn.toUpperCase() : '';
  const arM = measure(ar, spec.fontAr, wt(spec.fontAr), 112, 0);
  const enM = en ? measure(en, spec.fontLat, 400, 38, 7) : null;
  if (layout === 'v'){
    const iconH = showIcon ? 400 : 0;
    const tw = Math.max(arM.w, enM ? enM.w : 0);
    const W = Math.max(iconH, tw) + 40;
    if (showIcon){ const m = mark(spec, c, v); m.setAttribute('transform', 'translate(' + r2((W-400)/2) + ' 0)'); g.append(m); }
    let y = iconH + (showIcon ? 60 : 0) + arM.h/2;
    g.append(T(ar, { fam: spec.fontAr, w: wt(spec.fontAr), size:112, cx: W/2, cy: y, fill: c.text }));
    y += arM.h/2;
    if (!showIcon){ g.append(el('rect', { x: r2(W/2 - 60), y: r2(y + 26), width:120, height:10, rx:5, fill:c.ac })); y += 36; }
    if (enM){ y += 40 + enM.h/2; g.append(T(en, { fam: spec.fontLat, w:400, size:38, ls:7, cx: W/2, cy: y, fill: c.text, opacity: .85 })); y += enM.h/2; }
    return { g, w: W, h: y + 6 };
  }
  // horizontal (RTL: icon on the right, name to its left, right-aligned)
  const tw = Math.max(arM.w, enM ? enM.w : 0);
  const iconW = showIcon ? 400 : 0, gap = showIcon ? 56 : 0;
  const W = tw + gap + iconW, H = 400;
  if (showIcon){ const m = mark(spec, c, v); m.setAttribute('transform', 'translate(' + r2(tw + gap) + ' 0)'); g.append(m); }
  const blockH = arM.h + (enM ? 44 + enM.h : 0);
  const top = (H - blockH)/2;
  g.append(T(ar, { fam: spec.fontAr, w: wt(spec.fontAr), size:112, align:'right', x: tw, cy: top + arM.h/2, fill: c.text }));
  if (enM) g.append(T(en, { fam: spec.fontLat, w:400, size:38, ls:7, align:'right', x: tw, cy: top + arM.h + 44 + enM.h/2, fill: c.text, opacity: .85 }));
  if (!showIcon) g.append(el('rect', { x: r2(tw - 90), y: r2(top + blockH + 30), width:90, height:10, rx:5, fill:c.ac }));
  return { g, w: W, h: H + (showIcon ? 0 : 40) };
}
function place(lk, x, y, w, h, alignX){
  const s = Math.min(w / lk.w, h / lk.h);
  const dx = alignX === 'right' ? x + w - lk.w*s : alignX === 'left' ? x : x + (w - lk.w*s)/2;
  lk.g.setAttribute('transform', 'translate(' + r2(dx) + ' ' + r2(y + (h - lk.h*s)/2) + ') scale(' + r2(s*1000)/1000 + ')');
  return lk.g;
}

/* ---------- color plan ---------- */
function plan(spec){
  FIXES = [];
  const P = spec.palette, by = (r) => P.find((c) => c.role === r).hex;
  const pri = by('أساسي'), sec = by('ثانوي'), bg = by('خلفية'), txt = by('نص'), acc = by('لمسة');
  const all = P.map((c) => c.hex);
  const K = { pri, sec, bg, txt, acc };
  K.text = ensure(txt, bg, 4.5, 'النص على الخلفية', all);
  K.markOnBg = ensure(pri, bg, 3, 'الشعار على الخلفية', all);
  K.revFg = ensure(bg, pri, 4.5, 'الحروف على اللون الأساسي', all);
  K.accOnBg = contrast(acc, bg) >= 1.6 ? acc : sec;
  K.accOnPri = contrast(acc, pri) >= 1.6 ? acc : K.revFg;
  K.cardTitle = ensure(pri, bg, 4.5, 'المسمى الوظيفي في الكرت', all);
  K.postBg = sec;
  K.postText = ensure(contrast(bg, sec) >= contrast(txt, sec) ? bg : txt, sec, 4.5, 'نص المنشور', all);
  K.postAcc = contrast(acc, sec) >= 1.6 ? acc : pri;
  K.signBoard = lum(txt) < lum(pri) ? txt : pri;
  K.signText = ensure(bg, K.signBoard, 4.5, 'اسم المحل على اللوحة', all);
  K.signAcc = contrast(acc, K.signBoard) >= 1.6 ? acc : sec;
  return K;
}
const onBg = (K) => ({ fg: K.markOnBg, ko: K.bg, ac: K.accOnBg, text: K.text });
const onPri = (K) => ({ fg: K.revFg, ko: K.pri, ac: K.accOnPri, text: K.revFg });

  const f2 = h('figure'); const post = h('div','post'); const hd = document.createElement('header');
  const av = h('div','av'); av.append(iconSVG(spec, K, VAR, 'pri')); const who = h('div'); who.append(h('b', null, spec.nameAr), h('small', null, 'قبل دقيقة'));
  hd.append(av, who); post.append(hd, postSVG(spec, K, VAR), h('p','cap', spec.sloganAr || spec.nameAr));
  f2.append(post, h('figcaption', null, 'منشور ١٠٨٠ × ١٠٨٠'));
  const f3 = h('figure','wide'); f3.append(signSVG(spec, K, VAR), h('figcaption', null, 'واجهة المحل واللوحة الجانبية'));
  mk.append(f1, f2, f3); ms.append(mk); board.append(ms);

  const ag = h('div','again');
  const rb = h('button','btn2','نسخة ثانية بنفس الملف'); rb.type = 'button'; rb.addEventListener('click', () => run());
  ag.append(rb); board.append(ag);
}

/* ---------- copy / toast ---------- */
let tt;
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 1800); }
async function copy(txt, btn){
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
  }
  const cp = btn.querySelector('.cp'); btn.classList.add('done'); if (cp){ cp.textContent = ok ? 'انتسخ' : 'انسخه يدوي'; setTimeout(() => { cp.textContent = 'نسخ'; btn.classList.remove('done'); }, 1500); }
  toast(ok ? 'انتسخ ' + txt : 'ما قدرنا ننسخ، الكود: ' + txt);
}

/* ---------- downloads ---------- */
function safeName(){ return (SPEC.nameEn || 'brand').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'brand'; }
function save(blob, name){
  const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}
function downloadLogo(){
  const s = logoSVG(SPEC, KOL, VAR);
  const st = el('style'); st.textContent = "@import url('" + fontHref(SPEC.fontAr) + "');@import url('" + fontHref(SPEC.fontLat) + "');";
  s.insertBefore(st, s.firstChild.nextSibling);
  const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(s);
  save(new Blob([xml], { type:'image/svg+xml' }), safeName() + '-logo.svg');
  toast('نزل الشعار');
}
// draw an SVG to canvas: shapes via <img>, text via fillText with the page's loaded fonts
async function drawSVG(ctx, svg, ox, oy, scale){
  const clone = svg.cloneNode(true); clone.querySelectorAll('text,title').forEach((t) => t.remove());
  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type:'image/svg+xml' }));
  const vb = svg.viewBox.baseVal;
  await new Promise((res, rej) => { const img = new Image(); img.onload = () => { ctx.drawImage(img, ox, oy, vb.width*scale, vb.height*scale); res(); }; img.onerror = rej; img.src = url; });
  URL.revokeObjectURL(url);
  svg.querySelectorAll('text').forEach((t) => {
    let m = new DOMMatrix(), alpha = 1;
    const chain = [];
    for (let n = t; n && n !== svg; n = n.parentNode){
      if (n.transform && n.transform.baseVal.numberOfItems) chain.unshift(n.transform.baseVal.consolidate().matrix);
      if (n.getAttribute && n.getAttribute('opacity')) alpha *= +n.getAttribute('opacity');
    }
    chain.forEach((x) => { m = m.multiply(DOMMatrix.fromMatrix(x)); });
    ctx.save();
    ctx.setTransform(scale*m.a, scale*m.b, scale*m.c, scale*m.d, ox + scale*m.e, oy + scale*m.f);
    ctx.globalAlpha = alpha;
    ctx.font = t.getAttribute('font-weight') + ' ' + t.getAttribute('font-size') + 'px ' + t.getAttribute('font-family') + ', sans-serif';
    if ('letterSpacing' in ctx) ctx.letterSpacing = (+t.getAttribute('letter-spacing') || 0) + 'px';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.direction = 'ltr';
    const x = +t.getAttribute('x'), y = +t.getAttribute('y');
    if (t.getAttribute('stroke')){ ctx.strokeStyle = t.getAttribute('stroke'); ctx.lineWidth = +t.getAttribute('stroke-width'); ctx.lineJoin = 'round'; ctx.strokeText(t.textContent, x, y); }
    ctx.fillStyle = t.getAttribute('fill');
    ctx.fillText(t.textContent, x, y);
    ctx.restore();
  });
}
async function downloadCard(){
  try {
    const sc = 2, pad = 80, gap = 60;
    const c = document.createElement('canvas'); c.width = 1050*sc + pad*2; c.height = 600*sc*2 + gap + pad*2;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#E4E6E1'; ctx.fillRect(0, 0, c.width, c.height);
    await document.fonts.ready;
    await drawSVG(ctx, cardFront(SPEC, KOL, VAR), pad, pad, sc);
    await drawSVG(ctx, cardBack(SPEC, KOL, VAR), pad, pad + 600*sc + gap, sc);
    c.toBlob((b) => { if (b){ save(b, safeName() + '-card.png'); toast('نزل الكرت'); } else toast('ما قدرنا نجهز الصورة، جرّب مرة ثانية'); }, 'image/png');
  } catch (e) { toast('ما قدرنا نجهز الصورة، جرّب مرة ثانية'); }
}

/* ---------- request ---------- */
function readInput(){
  return {
    nameAr: clip($('#nameAr').value, 40),
    nameEn: clip($('#nameEn').value, 40).replace(/[^\p{L}\p{N} &'.-]/gu, ''),
    sector: (document.querySelector('#sector input:checked') || {}).value || 'مقهى',
    persona: [...document.querySelectorAll('#persona input:checked')].map((i) => i.value)
  };
}
let busy = false;
async function run(){
  if (busy) return;
  const inp = readInput();
  if (!inp.nameAr){ $('#nameAr').focus(); hint('اكتب اسم النشاط أول.', true); return; }
  if (inp.persona.length < 2){ hint('اختر كلمتين على الأقل تصف شخصية العلامة.', true); document.querySelector('#persona input').focus(); return; }
  hint('');
  busy = true; const go = $('#go'); go.disabled = true; go.textContent = 'نصمم…';
  INPUT = inp; showLoading();
  if (window.matchMedia('(max-width: 999px)').matches) board.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  const text = 'اسم النشاط: ' + inp.nameAr + '\nالاسم بالإنجليزي: ' + (inp.nameEn || '') + '\nالقطاع: ' + inp.sector + '\nالشخصية: ' + inp.persona.join('، ');
  const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch('/api/demo', { method:'POST', headers:{ 'content-type':'application/json' }, signal: ctrl.signal,
      body: JSON.stringify({ demo:'identity', messages:[{ role:'user', text }] }) });
    if (!r.ok){
      showError(r.status === 429 ? 'الطلبات كثيرة هالحين. انتظر دقيقة وجرّب مرة ثانية.'
        : r.status === 503 ? 'الاستوديو مقفل مؤقتاً للصيانة. جرّب بعد شوي.'
        : r.status === 403 || r.status === 415 ? 'ما قدرنا نستقبل الطلب من هذي الصفحة. حدّث الصفحة وجرّب مرة ثانية.'
        : 'ما وصلتنا الهوية هالمرة. اضغط «أعد المحاولة».');
      return;
    }
    const j = await r.json().catch(() => null);
    if (!j || !j.data || typeof j.data !== 'object'){ showError('وصلنا رد ناقص وما نقدر نرسم منه هوية. اضغط «أعد المحاولة».'); return; }
    const spec = normalize(j.data, inp);
    await Promise.all([loadFont(spec.fontAr, spec.nameAr + spec.letters + (spec.sloganAr || '') + 'الاسم الكامل المسمى الوظيفي البريد الإلكتروني المدينة'), loadFont(spec.fontLat, (spec.nameEn || '') + spec.letters + (spec.sloganEn || '') + 'AaGgRr05X 0123456789')]);
    SPEC = spec; VERSION++; VAR = hash(spec.nameAr + spec.concept) % (spec.type === 'symbol' ? 2 : 3);
    render();
  } catch (e) {
    showError(e && e.name === 'AbortError' ? 'تأخر الرد أكثر من ٣٠ ثانية. اضغط «أعد المحاولة».' : 'انقطع الاتصال. تأكد من الإنترنت واضغط «أعد المحاولة».');
  } finally {
    clearTimeout(tm); busy = false; go.disabled = false; go.textContent = 'صمم الهوية';
  }
}
$('#brief').addEventListener('submit', (e) => { e.preventDefault(); run(); });
})();
</script>
