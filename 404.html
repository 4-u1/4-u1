<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الصفحة غير موجودة · يزيد حمد الحارثي</title>
<meta name="robots" content="noindex, follow">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#07090D">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@500;600;700;800&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090D;--ink:#F4F5F7;--mut:#8B93A1;--blue:#4FB8E8;--blue2:#17719F;--gold:#E9B949;--line:#1C2330}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif;min-height:100svh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;pointer-events:none}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:120px 120px;mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000,transparent 75%)}
.glow{position:absolute;left:50%;top:34%;width:620px;height:620px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(79,184,232,.16),transparent 62%);filter:blur(30px)}
.wrap{position:relative;z-index:1;text-align:center;padding:40px 22px;max-width:560px;width:100%}
.logo{font-family:Inter;font-weight:800;font-size:30px;letter-spacing:-.02em;margin-bottom:34px;direction:ltr}
.logo .y{color:#F4F5F7}.logo .h{color:var(--blue)}.logo .d{color:var(--gold)}
.code{font-family:'Space Grotesk','Inter',monospace;font-weight:600;font-size:120px;line-height:.9;letter-spacing:.02em;background:linear-gradient(180deg,#EAF6FD,#4FB8E8 60%,#17719F);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
h1{font-size:26px;margin:18px 0 10px;font-weight:700}
p{color:var(--mut);font-size:16px;line-height:1.9;margin:0 auto 6px;max-width:420px}
p.en{font-family:Inter;font-size:13.5px;letter-spacing:.01em;color:#6B7482;margin-bottom:30px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:9px;min-height:50px;padding:0 24px;border-radius:999px;font:inherit;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:0}
.go{color:#06121C;background:linear-gradient(180deg,#6CC6EE,#4FB8E8);box-shadow:0 16px 36px -16px rgba(79,184,232,.75)}
.go:hover{filter:brightness(1.05)}
.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.ghost:hover{border-color:#2C3647}
.svg{width:18px;height:18px}
.foot{margin-top:38px;font-size:12.5px;color:#5A6472}
.foot a{color:#8B93A1;text-decoration:none}.foot a:hover{color:var(--blue)}
@media (max-width:560px){.code{font-size:92px}h1{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.glow{animation:breathe 6s ease-in-out infinite}}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="grid"></div><div class="glow"></div></div>
<main class="wrap">
  <div class="logo"><span class="y">Y</span><span class="h">H</span><span class="d">.</span></div>
  <p class="code">404</p>
  <h1>الصفحة غير موجودة</h1>
  <p>الرابط اللي دخلت عليه غير صحيح أو تم نقله. تأكد من العنوان، أو ارجع للرئيسية.</p>
  <p class="en">This page doesn’t exist — it may have been moved or never existed.</p>
  <div class="btns">
    <a class="btn go" href="/">
      <svg class="svg" viewBox="0 0 24 24" fill="none" stroke="#06121C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      العودة للرئيسية
    </a>
    <a class="btn ghost" href="/#contact">تواصل معي</a>
  </div>
  <div class="foot">يزيد حمد الحارثي · مهندس حلول ذكاء اصطناعي · <a href="/">yazeedalharthi.sa</a></div>
</main>
</body>
</html>
